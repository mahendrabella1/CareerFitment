<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2f6bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0050d8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#12996b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a6b47;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e08a1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c56f0f;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RIASEC Career Interest Profile</text>

  <!-- R - Realistic (85%) -->
  <text x="50" y="80" font-size="13" font-weight="bold" fill="#1a1a1a">Realistic</text>
  <rect x="140" y="70" width="300" height="20" fill="#f0f0f0" rx="3"/>
  <rect x="140" y="70" width="255" height="20" fill="url(#bar1)" rx="3"/>
  <text x="410" y="85" font-size="12" font-weight="bold" fill="#2f6bff">85%</text>

  <!-- I - Investigative (72%) -->
  <text x="50" y="135" font-size="13" font-weight="bold" fill="#1a1a1a">Investigative</text>
  <rect x="140" y="125" width="300" height="20" fill="#f0f0f0" rx="3"/>
  <rect x="140" y="125" width="216" height="20" fill="url(#bar2)" rx="3"/>
  <text x="410" y="140" font-size="12" font-weight="bold" fill="#12996b">72%</text>

  <!-- A - Artistic (58%) -->
  <text x="50" y="190" font-size="13" font-weight="bold" fill="#1a1a1a">Artistic</text>
  <rect x="140" y="180" width="300" height="20" fill="#f0f0f0" rx="3"/>
  <rect x="140" y="180" width="174" height="20" fill="url(#bar3)" rx="3"/>
  <text x="410" y="195" font-size="12" font-weight="bold" fill="#e08a1e">58%</text>

  <!-- S - Social (65%) -->
  <text x="50" y="245" font-size="13" font-weight="bold" fill="#1a1a1a">Social</text>
  <rect x="140" y="235" width="300" height="20" fill="#f0f0f0" rx="3"/>
  <rect x="140" y="235" width="195" height="20" fill="url(#bar1)" rx="3"/>
  <text x="410" y="250" font-size="12" font-weight="bold" fill="#2f6bff">65%</text>

  <!-- E - Enterprising (70%) -->
  <text x="50" y="300" font-size="13" font-weight="bold" fill="#1a1a1a">Enterprising</text>
  <rect x="140" y="290" width="300" height="20" fill="#f0f0f0" rx="3"/>
  <rect x="140" y="290" width="210" height="20" fill="url(#bar2)" rx="3"/>
  <text x="410" y="305" font-size="12" font-weight="bold" fill="#12996b">70%</text>

  <!-- C - Conventional (62%) -->
  <text x="50" y="325" font-size="13" font-weight="bold" fill="#1a1a1a">Conventional</text>
  <rect x="140" y="315" width="300" height="20" fill="#f0f0f0" rx="3"/>
  <rect x="140" y="315" width="186" height="20" fill="url(#bar3)" rx="3"/>
  <text x="410" y="330" font-size="12" font-weight="bold" fill="#e08a1e">62%</text>
</svg>