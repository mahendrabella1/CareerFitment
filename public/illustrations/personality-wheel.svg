<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wheel1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2f6bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0050d8;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#f0f0f0" stroke-width="1"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#f0f0f0" stroke-width="1"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Center circle -->
  <circle cx="200" cy="200" r="50" fill="url(#wheel1)" opacity="0.3"/>
  <circle cx="200" cy="200" r="40" fill="none" stroke="#2f6bff" stroke-width="2"/>

  <!-- 8 Personality dimensions -->
  <!-- 1. Top (Extroversion) -->
  <circle cx="200" cy="50" r="15" fill="#2f6bff" opacity="0.8"/>
  <text x="200" y="35" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Extroversion</text>

  <!-- 2. Top-Right (Openness) -->
  <circle cx="307" cy="93" r="15" fill="#12996b" opacity="0.8"/>
  <text x="330" y="100" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Openness</text>

  <!-- 3. Right (Conscientiousness) -->
  <circle cx="350" cy="200" r="15" fill="#e08a1e" opacity="0.8"/>
  <text x="375" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Conscientiousness</text>

  <!-- 4. Bottom-Right (Agreeableness) -->
  <circle cx="307" cy="307" r="15" fill="#2f6bff" opacity="0.8"/>
  <text x="330" y="320" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Agreeableness</text>

  <!-- 5. Bottom (Emotional Stability) -->
  <circle cx="200" cy="350" r="15" fill="#12996b" opacity="0.8"/>
  <text x="200" y="375" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Emotional Stability</text>

  <!-- 6. Bottom-Left (Adaptability) -->
  <circle cx="93" cy="307" r="15" fill="#e08a1e" opacity="0.8"/>
  <text x="70" y="320" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Adaptability</text>

  <!-- 7. Left (Leadership) -->
  <circle cx="50" cy="200" r="15" fill="#2f6bff" opacity="0.8"/>
  <text x="25" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Leadership</text>

  <!-- 8. Top-Left (Creativity) -->
  <circle cx="93" cy="93" r="15" fill="#12996b" opacity="0.8"/>
  <text x="70" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Creativity</text>

  <!-- Center text -->
  <text x="200" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#2f6bff">YOUR</text>
  <text x="200" y="220" font-size="14" font-weight="bold" text-anchor="middle" fill="#2f6bff">PROFILE</text>
</svg>