<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2f6bff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#12996b;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- People analyzing career data -->
  <circle cx="150" cy="120" r="35" fill="#2f6bff" opacity="0.8"/>
  <circle cx="450" cy="140" r="35" fill="#12996b" opacity="0.8"/>
  <circle cx="300" cy="200" r="40" fill="#e08a1e" opacity="0.8"/>

  <!-- Connection lines (career pathways) -->
  <line x1="150" y1="120" x2="300" y2="200" stroke="#2f6bff" stroke-width="2" opacity="0.5"/>
  <line x1="450" y1="140" x2="300" y2="200" stroke="#12996b" stroke-width="2" opacity="0.5"/>

  <!-- Career nodes -->
  <circle cx="100" cy="300" r="20" fill="#2f6bff" opacity="0.6"/>
  <circle cx="200" cy="330" r="20" fill="#12996b" opacity="0.6"/>
  <circle cx="300" cy="320" r="20" fill="#e08a1e" opacity="0.6"/>
  <circle cx="400" cy="340" r="20" fill="#2f6bff" opacity="0.6"/>
  <circle cx="500" cy="310" r="20" fill="#12996b" opacity="0.6"/>

  <!-- Connecting dots to career path -->
  <line x1="300" y1="240" x2="100" y2="300" stroke="#666" stroke-width="1.5" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="300" y1="240" x2="500" y2="310" stroke="#666" stroke-width="1.5" opacity="0.3" stroke-dasharray="5,5"/>

  <!-- Title area -->
  <text x="300" y="380" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Career Discovery Journey</text>
</svg>