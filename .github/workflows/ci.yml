# Type-check and test every push and pull request (security audit L-07).
# The dependency audit is reported but doesn't fail the build - it flags issues that need a
# decision (e.g. a framework upgrade), not a reflex.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Same package manager and lockfile as Vercel (pnpm-lock.yaml).
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: pnpm audit (report only)
        run: pnpm audit --prod || true
